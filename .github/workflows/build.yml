name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Secrets доступны только для веток/тегов этого репозитория. В PR из форка
    # они пустые — сборка получается неподписанной, но тесты и lint всё равно
    # выполняются.
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode signing keystore
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rknvpn-release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/rknvpn-release.jks" >> "$GITHUB_ENV"
            echo "Signing keystore decoded into RUNNER_TEMP"
          else
            echo "No signing secrets: building an unsigned APK for this event"
          fi

      - name: Fetch mihomo and hev-socks5-tunnel
        run: bash scripts/fetch-core.sh

      - name: Cache Robolectric android-all
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-${{ runner.os }}-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          bash scripts/gradle-with-retry.sh :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: |
          chmod +x ./gradlew
          bash scripts/gradle-with-retry.sh :app:lintRelease --stacktrace

      - name: Assemble release APK
        run: |
          chmod +x ./gradlew
          bash scripts/gradle-with-retry.sh :app:assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rkn-vpn-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: Smoke test on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Два параллельных эмулятора уменьшают нагрузку на Maven Central и время очереди.
      max-parallel: 2
      matrix:
        include:
          - api-level: 24
            target: default
            arch: x86
          - api-level: 25
            target: default
            arch: x86
          - api-level: 26
            target: default
            arch: x86
          - api-level: 27
            target: default
            arch: x86
          - api-level: 28
            target: default
            arch: x86
          - api-level: 31
            target: google_apis
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64
          - api-level: 35
            target: google_apis
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu имеет /dev/kvm, но пользователь runner не входит
      # в группу kvm — без этого правила эмулятор падает по таймауту.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch mihomo and hev-socks5-tunnel
        run: bash scripts/fetch-core.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Launch app and run smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: Nexus 5
          emulator-boot-timeout: 600
          script: bash scripts/smoke-with-logcat.sh

      - name: Upload smoke logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-logcat-api${{ matrix.api-level }}
          path: |
            device-info.txt
            logcat-crash.txt
            logcat-fatal.txt
            logcat.txt
            anr-traces.txt
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish signed GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Отпечаток нового ключа подписи. Старый ключ скомпрометирован.
      EXPECTED_CERT_SHA256: fa8dc8198a713b10b1eb8e6faac429db8c2b607184a00764423d86cb017826cd
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require signing secrets for release tag
        run: |
          missing=()
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing signing secrets for ${GITHUB_REF_NAME}: ${missing[*]}"
            exit 1
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rkn-vpn-${{ github.run_number }}
          path: apk

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      # Даже если сборка как-то вышла неподписанной, в релиз она не попадёт.
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          expected="${EXPECTED_CERT_SHA256//:/}"
          expected="${expected,,}"
          count=0
          for apk in apk/*.apk; do
            [ -f "$apk" ] || continue
            if ! output="$(apksigner verify --print-certs "$apk" 2>&1)"; then
              echo "::error::apksigner failed for $apk: $output"
              exit 1
            fi
            signers="$(printf '%s\n' "$output" | grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' || true)"
            if [ "$signers" -ne 1 ]; then
              echo "::error::$apk has $signers signers, expected exactly 1"
              exit 1
            fi
            actual="$(printf '%s\n' "$output" \
              | sed -nE 's/^Signer #1 certificate SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/p' \
              | tr -d ':' | tr 'A-F' 'a-f')"
            if [ -z "$actual" ]; then
              echo "::error::Could not read SHA-256 certificate digest from $apk"
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::Wrong signing certificate in $apk: $actual (expected $expected)"
              exit 1
            fi
            echo "Verified $(basename "$apk"): $actual"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No APKs found to verify"
            exit 1
          fi

      # Имя ассета должно говорить пользователю, что это и для какого устройства.
      # ABI оставляем в имени: in-app обновление ищет ассет по подстроке ABI.
      - name: Name APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for apk in apk/*.apk; do
            name="$(basename "$apk")"
            abi="$(printf '%s' "$name" | sed -nE 's/^app-(.*)-release\.apk$/\1/p')"
            if [ -z "$abi" ]; then abi="universal"; fi
            mv "$apk" "apk/RKN-VPN-${VERSION}-${abi}.apk"
          done
          ls -1 apk

      - name: Append SHA-256 checksums to release notes
        run: |
          cp CHANGELOG_LATEST.md RELEASE_BODY.md
          {
            printf '\nSHA-256 / Контрольные суммы:\n'
            for apk in apk/*.apk; do
              sum="$(sha256sum "$apk" | cut -d' ' -f1)"
              printf '%s: %s\n' "$(basename "$apk")" "$sum"
            done
          } >> RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: apk/*.apk
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
